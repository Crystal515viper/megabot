version: "3.9"

services:
  # ==================== DATABASES ====================
  postgres:
    image: postgres:15-alpine
    container_name: trading_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trading_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-trading_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sh:/docker-entrypoint-initdb.d/init_db.sh
    networks:
      - db_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trading_user} -d ${POSTGRES_DB:-trading_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  redis:
    image: redis:7-alpine
    container_name: trading_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_secret}
    volumes:
      - redis_data:/data
    networks:
      - backend_net
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "${REDIS_PORT:-6379}:6379"

  # ==================== CORE SERVICES ====================
  orchestrator:
    build:
      context: ./orchestrator
      dockerfile: Dockerfile
    container_name: trading_orchestrator
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB:-trading_db}
      - DB_USER=${POSTGRES_USER:-trading_user}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis_secret}
      - ORCHESTRATOR_PORT=${ORCHESTRATOR_PORT:-8001}
      # TODO: Add exchange API credentials
      - EXCHANGE_API_KEY=${EXCHANGE_API_KEY:-}
      - EXCHANGE_API_SECRET=${EXCHANGE_API_SECRET:-}
    volumes:
      - ./orchestrator:/app
    networks:
      - backend_net
      - db_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.connect(('localhost', int('${ORCHESTRATOR_PORT:-8001}'))); s.close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  bot_long:
    build:
      context: ./bot_long
      dockerfile: Dockerfile
    container_name: trading_bot_long
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB:-trading_db}
      - DB_USER=${POSTGRES_USER:-trading_user}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis_secret}
      - BOT_TYPE=LONG
      - BOT_PORT=${BOT_LONG_PORT:-8002}
      # TODO: Add exchange API credentials
      - EXCHANGE_API_KEY=${EXCHANGE_API_KEY:-}
      - EXCHANGE_API_SECRET=${EXCHANGE_API_SECRET:-}
      # TODO: Add Telegram credentials
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
    volumes:
      - ./bot_long:/app
    networks:
      - backend_net
      - db_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      orchestrator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.connect(('localhost', int('${BOT_LONG_PORT:-8002}'))); s.close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  bot_short:
    build:
      context: ./bot_short
      dockerfile: Dockerfile
    container_name: trading_bot_short
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB:-trading_db}
      - DB_USER=${POSTGRES_USER:-trading_user}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis_secret}
      - BOT_TYPE=SHORT
      - BOT_PORT=${BOT_SHORT_PORT:-8003}
      # TODO: Add exchange API credentials
      - EXCHANGE_API_KEY=${EXCHANGE_API_KEY:-}
      - EXCHANGE_API_SECRET=${EXCHANGE_API_SECRET:-}
      # TODO: Add Telegram credentials
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
    volumes:
      - ./bot_short:/app
    networks:
      - backend_net
      - db_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      orchestrator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.connect(('localhost', int('${BOT_SHORT_PORT:-8003}'))); s.close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  api_gateway:
    build:
      context: ./api_gateway
      dockerfile: Dockerfile
    container_name: trading_api_gateway
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis_secret}
      - GATEWAY_PORT=${API_GATEWAY_PORT:-8000}
      - ORCHESTRATOR_URL=http://orchestrator:${ORCHESTRATOR_PORT:-8001}
      - BOT_LONG_URL=http://bot_long:${BOT_LONG_PORT:-8002}
      - BOT_SHORT_URL=http://bot_short:${BOT_SHORT_PORT:-8003}
    volumes:
      - ./api_gateway:/app
    networks:
      - backend_net
    ports:
      - "${API_GATEWAY_PORT:-8000}:${API_GATEWAY_PORT:-8000}"
    depends_on:
      redis:
        condition: service_healthy
      orchestrator:
        condition: service_healthy
      bot_long:
        condition: service_healthy
      bot_short:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.connect(('localhost', int('${API_GATEWAY_PORT:-8000}'))); s.close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ==================== MONITORING ====================
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: trading_prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    networks:
      - monitoring_net
      - backend_net
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  grafana:
    image: grafana/grafana:10.1.0
    container_name: trading_grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
    networks:
      - monitoring_net
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  backend_net:
    driver: bridge
    name: trading_backend_net
  db_net:
    driver: bridge
    name: trading_db_net
  monitoring_net:
    driver: bridge
    name: trading_monitoring_net

volumes:
  postgres_data:
    name: trading_postgres_data
  redis_data:
    name: trading_redis_data
  prometheus_data:
    name: trading_prometheus_data
  grafana_data:
    name: trading_grafana_data
