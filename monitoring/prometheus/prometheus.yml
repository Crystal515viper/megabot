global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'trading-system'

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Orchestrator service
  - job_name: 'orchestrator'
    static_configs:
      - targets: ['orchestrator:8001']
    metrics_path: '/metrics'

  # Bot Long service
  - job_name: 'bot_long'
    static_configs:
      - targets: ['bot_long:8002']
    metrics_path: '/metrics'

  # Bot Short service
  - job_name: 'bot_short'
    static_configs:
      - targets: ['bot_short:8003']
    metrics_path: '/metrics'

  # API Gateway
  - job_name: 'api_gateway'
    static_configs:
      - targets: ['api_gateway:8000']
    metrics_path: '/metrics'

  # TODO: Add additional scrape configs for exchange APIs if they expose metrics